name: Build & Release B-Plan APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Set up Python 3.11 & Run Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backend Unit Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic httpx beautifulsoup4 icalendar
          pytest tests/ -v

      - name: Build Android Release & Debug APK
        working-directory: android
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts for Release
        run: |
          mkdir -p release_artifacts
          cp android/app/build/outputs/apk/release/app-release.apk release_artifacts/B-Plan-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_artifacts/B-Plan-debug.apk
          ls -lh release_artifacts/

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: B-Plan-apks
          path: release_artifacts/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: "B-Plan ${{ github.ref_name || inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/B-Plan-release.apk
            release_artifacts/B-Plan-debug.apk
          body: |
            ## 🎓 B-Plan BNBU 校园助手 Release

            ### ✨ 本次发布主要功能特性：
            - **一屏三段研究生全景课表**：早中晚全天课程与教室无折叠全景呈现，零上下滑动即可一览全天及周一到周日安排。
            - **14节本科生细分模式**：自适应切换本科生 14 节标准作息网格，支持全时间轴精细视图。
            - **自定义课程时长与上课时间点**：支持任意时刻、任意时长自定义课程排课与修改。
            - **短课时智能自适应缩短**：TA辅导课等 1 小时短课自适应高度缩短呈现，避免过度占用空间。
            - **全显示教室名不截断**：长教室名（如 `CC502-R301`、`T3-201`）清晰显现。
            - **教师与助教精准解耦**：正课仅展示主讲授课教授，TA习题研讨课精准展示助教姓名。
            - **iSpace 作业/DDL 智能看板**：红黄绿三色紧急度倒计时，本地优先、状态持久化。
            - **腾讯企业邮箱与多协议支持**：全面支持 BNBU 腾讯企业邮（IMAP `imap.exmail.qq.com:993` / SMTP `smtp.exmail.qq.com:465` / POP3），支持邮件日程自主一键导入。
            - **双向手势操作**：右滑一键无缝唤起系统日历添加，左滑直接删除自定义或无效日程。
            - **全学期课程 .ics 日历导出**：支持一键导出标准 iCalendar 格式，无缝同步至 iOS / macOS / Windows / 小米 / 华为等系统日历。
