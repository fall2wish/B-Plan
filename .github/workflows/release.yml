name: Build & Release B-Plan APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v1.0.1)"
        required: false
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Set up Python 3.11 & Run Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backend Unit Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic httpx beautifulsoup4 icalendar
          pytest tests/ -v

      - name: Build Android Release & Debug APK
        working-directory: android
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts for Release
        run: |
          mkdir -p release_artifacts
          cp android/app/build/outputs/apk/release/app-release.apk release_artifacts/B-Plan-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_artifacts/B-Plan-debug.apk
          ls -lh release_artifacts/

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: B-Plan-apks
          path: release_artifacts/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: "B-Plan ${{ github.ref_name || inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/B-Plan-release.apk
            release_artifacts/B-Plan-debug.apk
          body: |
            ## 🎓 B-Plan BNBU 校园助手 Release

            ### 🚀 v1.0.1 本次升级主要特性：
            - **全自动后台静默登录**：CAS SSO / GSAS / iSpace 无弹窗后台静默认证，实现真正全自动化数据同步。
            - **智能容错与优雅降级**：连续 2 次静默登录失败时自动唤起可视化辅助窗口，既免除打扰又保证极端网络下的可用性。
            - **新手引导无缝衔接**：新用户在同意协议后立即引导绑定硬件加密凭据（Android KeyStore 物理隔离存储），一键完成首次全量同步。
            - **研究生 14 周官方专属校历**：严格对齐官方研究生周表，第 5 周跨国庆无缝切分、0 调休补课日、无自主阅读周中断、12月13日结课；支持 UG/PG 双校历智能推断与双向热切换。
            - **通用型 iSpace 待办与测验匹配引擎**：解除特定作业 ID 限制，全面兼容 `mod_assign` 与 `mod_quiz`，新增测验/练习专属徽章与动作状态识别。
            - **体验与性能优化**：修复已知界面细节问题，优化冷启动和后台同步平滑度。

            ---
            *附带 B-Plan 核心基础能力：一屏三段研究生全景课表、14 节细分视图、短课时自适应高度、教室名不截断、腾讯企业邮箱集成、全学期 .ics 日历导出。*
